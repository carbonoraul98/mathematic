<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg10" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="crossGlow" cx="0.5" cy="0.42" r="0.38">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="360" fill="url(#bg10)" rx="18"/>
  <circle cx="400" cy="150" r="160" fill="url(#crossGlow)"/>
  <!-- Radiant Path & Cross of Restoration -->
  <path d="M310 360 L385 210 L415 210 L490 360 Z" fill="#fde047" opacity="0.35"/>
  <rect x="392" y="75" width="16" height="125" rx="4" fill="#fef08a"/>
  <rect x="355" y="108" width="90" height="16" rx="4" fill="#fef08a"/>
  <!-- Connection Badge between Juan 13:36 and Juan 21:19 -->
  <rect x="75" y="215" width="270" height="72" rx="12" fill="rgba(15,23,42,0.8)" stroke="#38bdf8" stroke-width="2"/>
  <text x="210" y="242" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">ANTES DE LA CAÍDA (Juan 13:36 NTV)</text>
  <text x="210" y="266" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="13">«Ahora no puedes... me seguirás después»</text>

  <rect x="455" y="215" width="270" height="72" rx="12" fill="rgba(15,23,42,0.8)" stroke="#34d399" stroke-width="2"/>
  <text x="590" y="242" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold">TRAS LA RESTAURACIÓN (Juan 21:19 NTV)</text>
  <text x="590" y="266" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold">«Después Jesús le dijo: ¡Sígueme!»</text>

  <text x="30" y="42" fill="#a7f3d0" font-family="sans-serif" font-size="16" font-weight="bold">CIERRE • DE LA PROMESA EN JUAN 13:36 A LA RESTAURACIÓN EN JUAN 21:19 (NTV)</text>
  <text x="30" y="335" fill="#d1fae5" font-family="sans-serif" font-size="14" font-style="italic">Cuando nos arrepentimos de corazón, el Señor transforma nuestra caída en un nuevo comienzo: «¡Sígueme!»</text>
</svg>