<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg9" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
  </defs>
  <rect width="800" height="360" fill="url(#bg9)" rx="18"/>
  <!-- Three Restoration Cards corresponding to the 3 Denials (Juan 21:15-17 NTV) -->
  <g transform="translate(45, 78)">
    <rect x="0" y="0" width="220" height="190" rx="16" fill="rgba(15,23,42,0.75)" stroke="#38bdf8" stroke-width="2"/>
    <text x="110" y="38" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="bold">1ª PREGUNTA (Juan 21:15)</text>
    <text x="110" y="70" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="14">«Simón, hijo de Jonás,</text>
    <text x="110" y="90" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="14">¿me amas más que estos?»</text>
    <text x="110" y="122" text-anchor="middle" fill="#fde047" font-family="sans-serif" font-size="13">«Sí, Señor, tú sabes que te quiero»</text>
    <text x="110" y="160" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="bold">🐑 «Alimenta a mis corderos»</text>

    <rect x="245" y="0" width="220" height="190" rx="16" fill="rgba(15,23,42,0.75)" stroke="#818cf8" stroke-width="2"/>
    <text x="355" y="38" text-anchor="middle" fill="#818cf8" font-family="sans-serif" font-size="15" font-weight="bold">2ª PREGUNTA (Juan 21:16)</text>
    <text x="355" y="70" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="14">«Simón, hijo de Jonás,</text>
    <text x="355" y="90" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="14">¿me amas?»</text>
    <text x="355" y="122" text-anchor="middle" fill="#fde047" font-family="sans-serif" font-size="13">«Sí, Señor, tú sabes que te quiero»</text>
    <text x="355" y="160" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="bold">🐑 «Cuida de mis ovejas»</text>

    <rect x="490" y="0" width="220" height="190" rx="16" fill="rgba(15,23,42,0.75)" stroke="#fbbf24" stroke-width="2"/>
    <text x="600" y="38" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="15" font-weight="bold">3ª PREGUNTA (Juan 21:17)</text>
    <text x="600" y="70" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="14">«Simón, hijo de Jonás,</text>
    <text x="600" y="90" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="14">¿me quieres?»</text>
    <text x="600" y="122" text-anchor="middle" fill="#fde047" font-family="sans-serif" font-size="13">«Señor, tú sabes todo...»</text>
    <text x="600" y="160" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="bold">🐑 «Alimenta a mis ovejas»</text>
  </g>
  <text x="30" y="42" fill="#fde047" font-family="sans-serif" font-size="16" font-weight="bold">PARTE 2 • LAS TRES PREGUNTAS DE RESTAURACIÓN EN JUAN 21:15-17 (NTV)</text>
  <text x="30" y="335" fill="#fef3c7" font-family="sans-serif" font-size="14" font-style="italic">Tres veces lo negó junto a una fogata; tres veces Jesús sanó su corazón junto a otra fogata en Galilea</text>
</svg>