<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="360" fill="url(#bg8)" rx="18"/>
  <!-- 4 Steps diagram showing how Peter arrived at the denial -->
  <g transform="translate(45, 85)">
    <rect x="0" y="0" width="160" height="175" rx="14" fill="#312e81" stroke="#818cf8" stroke-width="2"/>
    <text x="80" y="42" text-anchor="middle" font-size="30">😤</text>
    <text x="80" y="75" text-anchor="middle" fill="#fde047" font-family="sans-serif" font-size="14" font-weight="bold">1. Autoconfianza</text>
    <text x="80" y="102" text-anchor="middle" fill="#e0e7ff" font-family="sans-serif" font-size="12">«Aunque todos te</text>
    <text x="80" y="120" text-anchor="middle" fill="#e0e7ff" font-family="sans-serif" font-size="12">abandonen, yo</text>
    <text x="80" y="138" text-anchor="middle" fill="#e0e7ff" font-family="sans-serif" font-size="12">jamás lo haré»</text>

    <rect x="185" y="0" width="160" height="175" rx="14" fill="#312e81" stroke="#818cf8" stroke-width="2"/>
    <text x="265" y="42" text-anchor="middle" font-size="30">😴</text>
    <text x="265" y="75" text-anchor="middle" fill="#fde047" font-family="sans-serif" font-size="14" font-weight="bold">2. No Orar</text>
    <text x="265" y="102" text-anchor="middle" fill="#e0e7ff" font-family="sans-serif" font-size="12">Se durmió en</text>
    <text x="265" y="120" text-anchor="middle" fill="#e0e7ff" font-family="sans-serif" font-size="12">Getsemaní en vez</text>
    <text x="265" y="138" text-anchor="middle" fill="#e0e7ff" font-family="sans-serif" font-size="12">de velar y orar</text>

    <rect x="370" y="0" width="160" height="175" rx="14" fill="#312e81" stroke="#818cf8" stroke-width="2"/>
    <text x="450" y="42" text-anchor="middle" font-size="30">👣</text>
    <text x="450" y="75" text-anchor="middle" fill="#fde047" font-family="sans-serif" font-size="14" font-weight="bold">3. Seguir de Lejos</text>
    <text x="450" y="102" text-anchor="middle" fill="#e0e7ff" font-family="sans-serif" font-size="12">Siguió a Jesús</text>
    <text x="450" y="120" text-anchor="middle" fill="#e0e7ff" font-family="sans-serif" font-size="12">a distancia y se</text>
    <text x="450" y="138" text-anchor="middle" fill="#e0e7ff" font-family="sans-serif" font-size="12">sentó al fuego</text>

    <rect x="555" y="0" width="160" height="175" rx="14" fill="#312e81" stroke="#f59e0b" stroke-width="2"/>
    <text x="635" y="42" text-anchor="middle" font-size="30">💧</text>
    <text x="635" y="75" text-anchor="middle" fill="#fde047" font-family="sans-serif" font-size="14" font-weight="bold">4. La Mirada</text>
    <text x="635" y="102" text-anchor="middle" fill="#e0e7ff" font-family="sans-serif" font-size="12">Jesús ya lo sabía,</text>
    <text x="635" y="120" text-anchor="middle" fill="#e0e7ff" font-family="sans-serif" font-size="12">lo miró con amor</text>
    <text x="635" y="138" text-anchor="middle" fill="#e0e7ff" font-family="sans-serif" font-size="12">y Pedro lloró</text>
  </g>
  <text x="30" y="42" fill="#fde047" font-family="sans-serif" font-size="16" font-weight="bold">RESUMEN PARTE 1 • ¿CÓMO LLEGÓ PEDRO A LA NEGACIÓN? (Y CÓMO NOS PASA A NOSOTROS)</text>
  <text x="30" y="335" fill="#e0e7ff" font-family="sans-serif" font-size="14" font-style="italic">El Señor ya sabía todo este proceso antes de que ocurriera, y preparó el camino para su restauración</text>
</svg>