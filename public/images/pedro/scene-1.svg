<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="sea1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <radialGradient id="sun1" cx="0.75" cy="0.35" r="0.35">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="360" fill="url(#bg1)" rx="18"/>
  <circle cx="600" cy="126" r="130" fill="url(#sun1)"/>
  <circle cx="600" cy="126" r="42" fill="#fef08a"/>
  <!-- Mountains of Galilee -->
  <path d="M0 220 L140 155 L290 205 L460 145 L640 195 L800 160 L800 230 L0 230 Z" fill="#1e293b" opacity="0.8"/>
  <!-- Sea of Galilee -->
  <rect x="0" y="220" width="800" height="140" fill="url(#sea1)"/>
  <!-- Sun reflection on water -->
  <ellipse cx="600" cy="245" rx="55" ry="6" fill="#fde047" opacity="0.6"/>
  <ellipse cx="600" cy="265" rx="40" ry="5" fill="#fde047" opacity="0.45"/>
  <ellipse cx="600" cy="285" rx="25" ry="4" fill="#fde047" opacity="0.3"/>
  <!-- Fishing Boat -->
  <g transform="translate(180, 150)">
    <path d="M20 85 L180 85 L155 120 L45 120 Z" fill="#78350f" stroke="#b45309" stroke-width="2"/>
    <line x1="100" y1="10" x2="100" y2="85" stroke="#a16207" stroke-width="5"/>
    <path d="M100 15 Q150 45 140 78 L100 78 Z" fill="#fef3c7" opacity="0.9"/>
    <!-- Fishing Net -->
    <path d="M165 95 Q210 120 230 145 Q190 150 155 120" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
    <!-- Figures: Jesus & Simon Peter -->
    <circle cx="80" cy="58" r="10" fill="#fde68a"/>
    <path d="M68 85 Q80 65 92 85 Z" fill="#e2e8f0"/>
    <circle cx="125" cy="62" r="9" fill="#fcd34d"/>
    <path d="M114 85 Q125 68 136 85 Z" fill="#38bdf8"/>
  </g>
  <text x="30" y="42" fill="#bae6fd" font-family="sans-serif" font-size="16" font-weight="bold">PASO 1 • EL LLAMADO DE SIMÓN PEDRO EN GALILEA</text>
  <text x="30" y="335" fill="#e0f2fe" font-family="sans-serif" font-size="14" font-style="italic">«De ahora en adelante, serás pescador de hombres» — El discípulo apasionado que caminó con Jesús</text>
</svg>