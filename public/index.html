<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Advancive Mathematics</title>

  <link rel="stylesheet" href="styles/style.css" />
</head>

<body>
  <div class="space"></div>
  <div class="fog"></div>

  <!-- PORTADA + LOGIN -->

  <div class="screen active" id="home">
    <img src="images/astronaut-hero.png" class="logo logo--minimal" alt="Astronauta Advancive Mathematics" />

    <div class="brand-title">
      <span class="brand-title__primary">ADVANCIVE</span>
      <span class="brand-title__secondary">MATHEMATICS</span>
    </div>

    <div class="subtitle">Aprende · Practica · Avanza</div>

    <div class="panel panel--sm panel--minimal">
      <div class="input-icon-field">
        <span class="input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </span>
        <input type="text" id="loginUser" placeholder="Usuario o correo" />
      </div>

      <div class="input-icon-field password-field">
        <span class="input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </span>
        <input type="password" id="loginPass" placeholder="Contraseña" />
        <button type="button" class="password-toggle" id="passwordToggleBtn" onclick="togglePasswordVisibility()" aria-label="Mostrar contraseña">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>

      <div id="loginResult"></div>

      <button class="btn btn--flat" style="width: 100%; margin-top: var(--space-xl);" onclick="unifiedLogin()">INICIAR SESIÓN</button>

      <div class="login-links">
        <button type="button" class="login-links__forgot" onclick="showComingSoon()">¿Olvidaste tu contraseña?</button>
      </div>
    </div>

    <div class="signup-row">
      <span>¿No tienes cuenta?</span>
      <button type="button" class="btn btn--outline btn--sm" onclick="showComingSoon()">Crear cuenta</button>
    </div>
  </div>

  <!-- SELECCIÓN DE ROL -->

  <div class="screen" id="roleSelect">
    <div class="brand-title">
      <span class="brand-title__primary">¿CÓMO QUERÉS</span>
      <span class="brand-title__secondary">INGRESAR?</span>
    </div>

    <div class="panel panel--sm panel--minimal">
      <button type="button" class="role-card role-card--featured" onclick="enterAsRole('profesor')">
        <span class="role-card__icon role-card__icon--image">
          <img src="images/teacher-illustration.png" alt="Profesor" />
        </span>
        <span class="role-card__text">
          <strong>Profesor</strong>
          <small>Gestioná aulas, actividades y notas</small>
        </span>
      </button>

      <button type="button" class="role-card role-card--featured" onclick="enterAsRole('estudiante')">
        <span class="role-card__icon role-card__icon--image">
          <img src="images/student-illustration.png" alt="Estudiante" />
        </span>
        <span class="role-card__text">
          <strong>Estudiante</strong>
          <small>Mirá tus actividades y resultados</small>
        </span>
      </button>
    </div>
  </div>

  <!-- PANEL PROFESOR -->

  <div class="screen" id="teacherPanel">
    <div class="panel">
      <h1>PANEL DEL PROFESOR</h1>

        <div class="section show" id="menuPrincipal">
        <div class="menu-buttons">
          <button class="menu-btn" onclick="showTeacherSection('studentsSection')">
            📘 Crear estudiantes
          </button>

          <button class="menu-btn" onclick="showTeacherSection('activitiesSection')">
            📝 Crear actividades
          </button>

          <button class="menu-btn" onclick="showTeacherSection('viewActivitiesSection')">
            📋 Ver actividades
          </button>

          <button class="menu-btn" onclick="showTeacherSection('gradesSection')">
            📊 Ver notas
          </button>
        </div>
      </div>

      <!-- ESTUDIANTES -->

      <div class="section" id="studentsSection">
        <button class="back-btn" onclick="showTeacherSection('menuPrincipal')">← Volver al menú</button>
        <h2>Crear estudiantes</h2>

        <select id="studentGrade">
          <option>4A</option>
          <option>4B</option>

          <option>5A</option>
          <option>5B</option>
        </select>

        <input type="text" id="studentName" placeholder="Nombre completo" />

        <input type="text" id="studentUser" placeholder="Usuario" />

        <input type="password" id="studentPassword" placeholder="Contraseña" />

        <button class="btn" onclick="crearEstudiante()">
          CREAR ESTUDIANTE
        </button>

        <div style="margin-top: var(--space-2xl); border-top: 1px solid var(--color-border); padding-top: var(--space-xl);">
          <h3>📥 Cargar desde Excel</h3>
          
          <div class="file-upload-wrapper">
            <input type="file" id="excelFile" accept=".xlsx" class="file-upload-input" />
            <label for="excelFile" class="file-upload-label">
              <span class="file-upload-icon">📁</span>
              <span class="file-upload-text" id="fileUploadText">Seleccionar archivo Excel</span>
            </label>
          </div>
          
          <button class="btn" onclick="uploadExcel()" id="uploadBtn">
            <span id="uploadBtnText">CARGAR EXCEL</span>
            <div class="spinner" id="uploadSpinner" style="display: none;"></div>
          </button>
          
          <div class="progress-container" id="progressContainer" style="display: none;">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-text" id="progressText">0%</div>
          </div>
        </div>

        <div id="studentsList"></div>
      </div>

      <!-- ACTIVIDADES -->

      <div class="section" id="activitiesSection">
        <button class="back-btn" onclick="showTeacherSection('menuPrincipal')">← Volver al menú</button>
        <h2>Crear actividad</h2>

        <select id="activityTargetGrade">
          <option value="4">Grado 4</option>
          <option value="5">Grado 5</option>
        </select>

        <select id="activityType" style="margin-top: var(--space-md);">
          <option>Examen</option>
          <option>Actividad</option>
          <option>Quiz</option>
          <option>Refuerzo</option>
          <option>Recreativo</option>
        </select>

        <input type="text" id="activityTheme" placeholder="Tema" />

        <button class="btn" onclick="agregarPregunta()">
          AGREGAR PREGUNTA
        </button>

        <div id="questionsList"></div>

        <button class="btn" onclick="crearActividad()">
          GUARDAR ACTIVIDAD
        </button>

        <div style="margin-top: var(--space-2xl); border-top: 1px solid var(--color-border); padding-top: var(--space-xl);">
          <h3>📄 Cargar Examen (JSON)</h3>
          
          <input type="text" id="examTitle" placeholder="Título del examen" style="margin-bottom: var(--space-md);" />
          
          <textarea id="jsonExamInput" placeholder="Pegá aquí el JSON con las preguntas..." 
            style="width: 100%; min-height: 200px; background: var(--bg-input); color: var(--text-primary); 
            border: 1px solid var(--color-primary); border-radius: var(--radius-md); padding: var(--space-md); 
            font-family: monospace; margin-bottom: var(--space-md); resize: vertical;"></textarea>
            
          <button class="btn" onclick="importJsonExam()" id="importExamBtn">
            <span id="importBtnText">CARGAR EXAMEN</span>
            <div class="spinner" id="importSpinner" style="display: none;"></div>
          </button>
        </div>
      </div>

      <!-- VER ACTIVIDADES -->

      <div class="section" id="viewActivitiesSection">
        <button class="back-btn" onclick="showTeacherSection('menuPrincipal')">← Volver al menú</button>
        <h2>📋 Actividades Cargadas</h2>
        <div id="activitiesList"></div>
      </div>

      <!-- NOTAS -->

      <div class="section" id="gradesSection">
        <button class="back-btn" onclick="showTeacherSection('menuPrincipal')">← Volver al menú</button>
        <h2>Notas</h2>

        <button class="btn" onclick="downloadGrades()" style="margin-bottom: var(--space-xl);">📊 DESCARGAR CALIFICACIONES</button>

        <div id="gradesList"></div>
      </div>

      <button class="btn btn--secondary" style="margin-top: var(--space-4xl);" onclick="logout()">
        CERRAR SESIÓN
      </button>
    </div>
  </div>

  <!-- PANEL ESTUDIANTE -->

  <div class="screen" id="studentPanel">
    <button class="back-btn" onclick="logout()">Salir</button>
    <div class="panel">
      <h1>PANEL ESTUDIANTE</h1>

      <div id="studentActivities"></div>

      <button class="btn btn--secondary" style="margin-top: var(--space-4xl);" onclick="logout()">
        CERRAR SESIÓN
      </button>
    </div>
  </div>

  <script src="js/components/custom-alert.js"></script>
  <script src="js/components/question-modal.js"></script>
  <script src="js/components/activity-player.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
