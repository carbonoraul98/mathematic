<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Mathematic Pixel</title>

  <link rel="stylesheet" href="styles/style.css" />
</head>

<body>
  <div class="space"></div>
  <div class="fog"></div>

  <!-- PORTADA -->

  <div class="cover">
    <img src="https://mendozadocente.weebly.com/uploads/5/8/6/1/58617155/4144174_orig.png" alt="Logo" class="logo" />

    <h1 class="main-title">Mathematic's Adventure</h1>

    <button class="start-btn" onclick="startIntro()">INICIAR</button>
    <br>
    <a class="start-btn" type="button" href="index1.html">Ir a INDEX 1</a>
  </div>

  <!-- INTRO -->

  <div class="intro" id="intro">
    <div class="portal"></div>

    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>

    <div class="crack c1"></div>
    <div class="crack c2"></div>
    <div class="crack c3"></div>
    <div class="crack c4"></div>
  </div>

  <!-- MENU -->

  <div class="menu" id="menu">
    <div class="panel">
      <h1>MATHEMATIC'S ADVENTURE</h1>

      <div class="menu-screen">
        <div class="section-title">Selecciona el grado</div>

        <div class="options">
          <button class="option-btn grade" onclick="selectGrade(1, this)">
            1°
          </button>

          <button class="option-btn grade" onclick="selectGrade(2, this)">
            2°
          </button>

          <button class="option-btn grade" onclick="selectGrade(3, this)">
            3°
          </button>

          <button class="option-btn grade" onclick="selectGrade(4, this)">
            4°
          </button>

          <button class="option-btn grade" onclick="selectGrade(5, this)">
            5°
          </button>
        </div>

        <button class="play-btn" onclick="startGame()">JUGAR</button>
      </div>

      <div class="game">
        <div class="info" id="gradeText">Grado 1</div>

        <div class="question" id="question">5 + 5</div>

        <input type="number" id="answer" placeholder="Respuesta" />

        <br />

        <button class="play-btn" onclick="checkAnswer()">RESPONDER</button>

        <div class="result" id="result"></div>

        <div class="info" id="score">Puntos: 0</div>

        <div class="info" id="timer">Tiempo: 60</div>
      </div>
    </div>
  </div>

  <script src="js/components/custom-alert.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
