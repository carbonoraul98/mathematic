<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Mathematic Pixel</title>

  <link rel="stylesheet" href="styles/style.css" />
</head>

<body>
  <div class="space"></div>
  <div class="fog"></div>

  <!-- PORTADA -->

  <div class="screen active" id="home">
    <img src="https://mendozadocente.weebly.com/uploads/5/8/6/1/58617155/4144174_orig.png" class="logo" />

    <h1 class="main-title">MATHEMATIC'S ADVENTURE</h1>

    <div class="subtitle">Plataforma Inteligente de Matemáticas</div>

    <button class="btn" onclick="showScreen('portal')">INICIAR</button>
  </div>

  <!-- PORTALES -->

  <div class="screen" id="portal">
    <h1 class="main-title">SELECCIONA PORTAL</h1>

    <div class="options">
      <button class="btn" onclick="showScreen('teacherLogin')">
        PORTAL PROFESOR
      </button>

      <button class="btn" onclick="showScreen('studentLogin')">
        PORTAL ESTUDIANTE
      </button>
    </div>
  </div>

  <!-- LOGIN PROFESOR -->

  <div class="screen" id="teacherLogin">
    <button class="back-btn" onclick="showScreen('portal')">Volver</button>
    <div class="panel">
      <h1>LOGIN PROFESOR</h1>

      <input type="text" id="teacherUser" placeholder="Usuario" />

      <input type="password" id="teacherPass" placeholder="Contraseña" />

      <div id="teacherResult"></div>

      <div class="button-group">
        <button class="btn" onclick="teacherLogin()">INGRESAR</button>
        <button class="btn btn--secondary" onclick="showScreen('portal')">VOLVER</button>
      </div>
    </div>
  </div>

  <!-- LOGIN ESTUDIANTE -->

  <div class="screen" id="studentLogin">
    <button class="back-btn" onclick="showScreen('portal')">Volver</button>
    <div class="panel">
      <h1>PORTAL ESTUDIANTE</h1>

      <input type="text" id="studentLoginUser" placeholder="Usuario" />

      <input type="password" id="studentLoginPass" placeholder="Contraseña" />

      <div class="button-group">
        <button class="btn" onclick="studentLogin()">ENTRAR</button>
        <button class="btn btn--secondary" onclick="showScreen('portal')">VOLVER</button>
      </div>
    </div>
  </div>

  <!-- PANEL PROFESOR -->

  <div class="screen" id="teacherPanel">
    <div class="panel">
      <h1>PANEL DEL PROFESOR</h1>

      <div class="menu-buttons">
        <button class="menu-btn" onclick="showTeacherSection('studentsSection')">
          📘 Crear estudiantes
        </button>

        <button class="menu-btn" onclick="showTeacherSection('activitiesSection')">
          📝 Crear actividades
        </button>

        <button class="menu-btn" onclick="showTeacherSection('gradesSection')">
          📊 Ver notas
        </button>
      </div>

      <!-- ESTUDIANTES -->

      <div class="section" id="studentsSection">
        <h2>Crear estudiantes</h2>

        <select id="studentGrade">
          <option>1A</option>
          <option>1B</option>
          <option>1C</option>
          <option>1D</option>

          <option>2A</option>
          <option>2B</option>
          <option>2C</option>
          <option>2D</option>

          <option>3A</option>
          <option>3B</option>
          <option>3C</option>
          <option>3D</option>

          <option>4A</option>
          <option>4B</option>
          <option>4C</option>
          <option>4D</option>

          <option>5A</option>
          <option>5B</option>
          <option>5C</option>
          <option>5D</option>
        </select>

        <input type="text" id="studentName" placeholder="Nombre completo" />

        <input type="text" id="studentUser" placeholder="Usuario" />

        <input type="password" id="studentPassword" placeholder="Contraseña" />

        <button class="btn" onclick="crearEstudiante()">
          CREAR ESTUDIANTE
        </button>

        <div style="margin-top: var(--space-2xl); border-top: 1px solid var(--color-border); padding-top: var(--space-xl);">
          <h3>📥 Cargar desde Excel</h3>
          
          <div class="file-upload-wrapper">
            <input type="file" id="excelFile" accept=".xlsx" class="file-upload-input" />
            <label for="excelFile" class="file-upload-label">
              <span class="file-upload-icon">📁</span>
              <span class="file-upload-text" id="fileUploadText">Seleccionar archivo Excel</span>
            </label>
          </div>
          
          <button class="btn" onclick="uploadExcel()" id="uploadBtn">
            <span id="uploadBtnText">CARGAR EXCEL</span>
            <div class="spinner" id="uploadSpinner" style="display: none;"></div>
          </button>
          
          <div class="progress-container" id="progressContainer" style="display: none;">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-text" id="progressText">0%</div>
          </div>
        </div>

        <div id="studentsList"></div>
      </div>

      <!-- ACTIVIDADES -->

      <div class="section" id="activitiesSection">
        <h2>Crear actividad</h2>

        <select id="activityTargetGrade">
          <option value="1">Grado 1</option>
          <option value="2">Grado 2</option>
          <option value="3">Grado 3</option>
          <option value="4">Grado 4</option>
          <option value="5">Grado 5</option>
        </select>

        <select id="activityType" style="margin-top: var(--space-md);">
          <option>Examen</option>
          <option>Actividad</option>
          <option>Quiz</option>
          <option>Refuerzo</option>
          <option>Recreativo</option>
        </select>

        <input type="text" id="activityTheme" placeholder="Tema" />

        <button class="btn" onclick="agregarPregunta()">
          AGREGAR PREGUNTA
        </button>

        <div id="questionsList"></div>

        <button class="btn" onclick="crearActividad()">
          GUARDAR ACTIVIDAD
        </button>
      </div>

      <!-- NOTAS -->

      <div class="section" id="gradesSection">
        <h2>Notas</h2>

        <button class="btn" onclick="downloadGrades()" style="margin-bottom: var(--space-xl);">📊 DESCARGAR CALIFICACIONES</button>

        <div id="gradesList"></div>
      </div>

      <button class="btn btn--secondary" style="margin-top: var(--space-4xl);" onclick="showScreen('portal')">
        CERRAR SESIÓN
      </button>
    </div>
  </div>

  <!-- PANEL ESTUDIANTE -->

  <div class="screen" id="studentPanel">
    <button class="back-btn" onclick="showScreen('portal')">Salir</button>
    <div class="panel">
      <h1>PANEL ESTUDIANTE</h1>

      <div id="studentActivities"></div>

      <button class="btn btn--secondary" style="margin-top: var(--space-4xl);" onclick="showScreen('portal')">
        CERRAR SESIÓN
      </button>
    </div>
  </div>

  <script src="js/components/custom-alert.js"></script>
  <script src="js/components/question-modal.js"></script>
  <script src="js/components/activity-player.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
